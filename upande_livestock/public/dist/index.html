<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feeding · Upande Livestock</title>
    <!-- Poppins is self-hosted via @font-face in src/index.css (bundled). -->
    <!-- The loading cover. Mirrors www/livestock_app.html, which is what
         actually serves this app; kept in step so the dev server and the real
         page behave the same. Inline, because its job is to be on screen in
         the first frame. -->
    <style>
      /* Mirrors www/livestock_app.html, which is what actually serves this
         app. The difference mattered: the served page makes #livestock-root
         the scroller and leaves the window unscrollable, and a dev shell that
         scrolled the window hid a scroll listener that could never fire in
         production. */
      html, body { height: 100%; margin: 0; padding: 0; background: #fbfaf6; }
      body { overflow: hidden; }
      #livestock-root { height: 100vh; width: 100%; overflow: auto; }
      .lv-splash {
        position: fixed; inset: 0; z-index: 2147483000;
        display: flex; align-items: center; justify-content: center;
        background: #ffffff; transition: opacity 280ms ease;
      }
      .lv-splash img { width: 106px; height: auto; display: block; }
      .lv-splash.lv-leaving { opacity: 0; pointer-events: none; }
    </style>
    <script type="module" crossorigin src="/assets/upande_livestock/dist/livestock-C2UT0lto.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/upande_livestock/dist/livestock-BDNYXqfp.css">
  </head>
  <body>
    <div id="livestock-root"></div>
    <div class="lv-splash" id="lv-splash">
      <img src="/assets/upande_livestock/images/upande_mark.svg" alt="Upande Livestock" />
    </div>
  </body>
</html>
