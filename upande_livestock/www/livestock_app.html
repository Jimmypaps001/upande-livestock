<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Upande Livestock · Feeding</title>
		<link rel="icon" type="image/png" href="/assets/upande_livestock/images/upande_logo.png" />
		<link rel="apple-touch-icon" href="/assets/upande_livestock/images/upande_logo.png" />
		<!-- Poppins is self-hosted via @font-face in the bundled livestock_css. -->
		<link rel="stylesheet" href="{{ livestock_css }}" />

		<style>
			.navbar.navbar-light { display: none !important; }
			.web-footer { display: none !important; }
			html, body { height: 100%; margin: 0; padding: 0; background: #fbfaf6; }
			body { overflow: hidden; }
			#livestock-root { height: 100vh; width: 100%; overflow: auto;
				font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
			.page-content, .container, main.container { max-width: none !important; padding: 0 !important; margin: 0 !important; }

			/* The cover that holds the screen while the bundle loads.
			   Inline, and before the stylesheet link resolves, because its whole
			   job is to be on screen in the first frame — a splash that arrives
			   with the CSS arrives after the thing it was meant to hide. */
			.lv-splash {
				position: fixed; inset: 0; z-index: 2147483000;
				display: flex; align-items: center; justify-content: center;
				/* White, like Frappe's own splash — the cover belongs to the
				   crossing between the two apps, not to either one's paper. */
				background: #ffffff;
				transition: opacity 280ms ease;
			}
			/* No radius and no box: the mark is its own silhouette on nothing. */
			.lv-splash img { width: 132px; height: auto; display: block; }
			.lv-splash.lv-leaving { opacity: 0; pointer-events: none; }
			@keyframes lv-breathe {
				0%, 100% { opacity: 1; transform: scale(1); }
				50% { opacity: .55; transform: scale(.94); }
			}
			.lv-splash img { animation: lv-breathe 1400ms ease-in-out infinite; }
			@media (prefers-reduced-motion: reduce) { .lv-splash img { animation: none; } }
		</style>
	</head>
	<body>
		<div id="livestock-root"></div>
		<div class="lv-splash" id="lv-splash">
			<img src="/assets/upande_livestock/images/upande_mark.svg" alt="Upande Livestock" />
		</div>

		<script type="application/json" id="livestock-bootstrap">{{ bootstrap_json | safe }}</script>
		<script>
			(function () {
				var bootEl = document.getElementById("livestock-bootstrap");
				var boot = {};
				try { boot = JSON.parse(bootEl.textContent || "{}"); } catch (_) {}
				window.LIVESTOCK = {
					csrf_token: boot.csrf_token || window.csrf_token || "",
					bootstrap: boot
				};
			})();
		</script>
		<script type="module" src="{{ livestock_js }}"></script>
	</body>
</html>
