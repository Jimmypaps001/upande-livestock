    <!-- The loading cover. Mirrors www/livestock_app.html, which is what
         actually serves this app; kept in step so the dev server and the real
         page behave the same. Inline, because its job is to be on screen in
         the first frame. -->
    <style>
      html, body { height: 100%; margin: 0; background: #fbfaf6; }
      .lv-splash {
        position: fixed; inset: 0; z-index: 2147483000;
        display: flex; align-items: center; justify-content: center;
        background: #fbfaf6; transition: opacity 280ms ease;
      }
      .lv-splash img { width: 76px; height: 76px; border-radius: 18px; display: block;
        animation: lv-breathe 1400ms ease-in-out infinite; }
      .lv-splash.lv-leaving { opacity: 0; pointer-events: none; }
      @keyframes lv-breathe {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: .55; transform: scale(.94); }
      }
      @media (prefers-reduced-motion: reduce) { .lv-splash img { animation: none; } }
    </style>
