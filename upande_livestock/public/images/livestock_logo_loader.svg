<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 689 689" width="689" height="689" role="img" aria-label="Upande Livestock">
  <!-- Generated by scripts/build_livestock_logo.py — edit there. The splash loader:
       the Livestock scene on a loop (in, the herd's round, out). Pure CSS. -->
  <style>
    .arrow { transform-box: view-box; transform-origin: 348.5px 347px; }
    .head { transform-box: fill-box; transform-origin: 10% 70%; }
    .tail { transform-box: fill-box; transform-origin: 60% 0%; }
    .arrow { animation: lv-in-0 4000ms cubic-bezier(.3,.7,.2,1) infinite both; }
    .scene { animation: lv-in-1 4000ms cubic-bezier(.3,.7,.2,1) infinite both; }
    .ground { animation: lv-in-2 4000ms cubic-bezier(.3,.7,.2,1) infinite both; }
    .cow { animation: lv-in-3 4000ms cubic-bezier(.3,.7,.2,1) infinite both; }
    .head { animation: lv-round-0 4000ms cubic-bezier(.3,.7,.2,1) infinite both; }
    .tail { animation: lv-round-1 4000ms cubic-bezier(.3,.7,.2,1) infinite both; }
    @keyframes lv-in-0 {
      0% { transform: translate(0px, 0px) scale(1); opacity: 1; }
      8.1% { transform: translate(0px, 0px) scale(0); opacity: 0; }
      18% { transform: translate(0px, 0px) scale(0); opacity: 0; }
      82% { transform: translate(0px, 0px) scale(0); opacity: 0; }
      91.9% { transform: translate(0px, 0px) scale(0); opacity: 0; }
      100% { transform: translate(0px, 0px) scale(1); opacity: 1; }
    }
    @keyframes lv-in-1 {
      0% { opacity: 0; }
      2.16% { opacity: 1; }
      18% { opacity: 1; }
      82% { opacity: 1; }
      97.84% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes lv-in-2 {
      0% { strokeDashoffset: 1; }
      1.8% { strokeDashoffset: 1; }
      9% { strokeDashoffset: 0; }
      18% { strokeDashoffset: 0; }
      82% { strokeDashoffset: 0; }
      91% { strokeDashoffset: 0; }
      98.2% { strokeDashoffset: 1; }
      100% { strokeDashoffset: 1; }
    }
    @keyframes lv-in-3 {
      0% { transform: translate(-120px, 0px); opacity: 0; }
      4.5% { transform: translate(-120px, 0px); opacity: 0; }
      8.1% { opacity: 1; }
      16.56% { transform: translate(0px, 0px); opacity: 1; }
      18% { transform: translate(0px, 0px); opacity: 1; }
      82% { transform: translate(0px, 0px); opacity: 1; }
      83.44% { transform: translate(0px, 0px); opacity: 1; }
      91.9% { opacity: 1; }
      95.5% { transform: translate(-120px, 0px); opacity: 0; }
      100% { transform: translate(-120px, 0px); opacity: 0; }
    }
    @keyframes lv-round-0 {
      0% { transform: rotate(0deg); }
      18% { transform: rotate(0deg); }
      27.6% { transform: rotate(0deg); }
      42.32% { transform: rotate(16deg); }
      50% { transform: rotate(13deg); }
      56.4% { transform: rotate(16deg); }
      70.48% { transform: rotate(0deg); }
      82% { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes lv-round-1 {
      0% { transform: rotate(0deg); }
      18% { transform: rotate(0deg); }
      57.68% { transform: rotate(0deg); }
      64.08% { transform: rotate(-12deg); }
      70.48% { transform: rotate(7deg); }
      75.6% { transform: rotate(0deg); }
      82% { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .arrow, .scene, .scene * { animation: none !important; }
      .scene { opacity: 0; }
    }
  </style>
